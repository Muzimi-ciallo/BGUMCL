name: Update manifest on release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update update.json
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json, os
          ref = os.environ["REF_NAME"]
          repo = os.environ["REPO"]
          version = ref[1:] if ref.startswith("v") else ref
          data = {
              "version": version,
              "base_url": f"https://ghproxy.net/https://github.com/{repo}/releases/download/{ref}",
              "release_notes": "",
              "published_at": "",
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("wrote update.json:", data)
          PY

      - name: Commit update.json
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json unchanged"
            exit 0
          fi
          git commit -m "chore: update update.json to ${REF_NAME}"
          git push

      - name: Purge jsDelivr cache
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/update.json"

